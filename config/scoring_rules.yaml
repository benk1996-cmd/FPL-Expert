# FPL scoring & squad rules — 2026/27
#
# VERIFIED 2026-08-09 against the live game's own configuration:
#   https://fantasy.premierleague.com/api/bootstrap-static/  ->  game_config.rules / game_config.scoring
# The public rules page (https://fantasy.premierleague.com/en/help/rules) is a JS app and cannot be
# scraped directly; the API endpoint above is the same ruleset in machine-readable form and is the
# canonical source for this file. Divisors (saves per point, goals-conceded per point) and the
# defensive-contribution thresholds are NOT in the API payload and were confirmed from the
# Premier League's own rules explainers — those four values are the only ones not machine-verified.

season: "2026/27"
verified: true
verified_on: "2026-08-09"
source: "fantasy.premierleague.com/api/bootstrap-static/ (game_config)"

appearance:
  under_60: 1            # API: short_play
  sixty_plus: 2          # API: long_play

goal:
  GK: 10                 # NOTE: 10, not 6 — goalkeeper goals are worth more than outfield
  DEF: 6
  MID: 5
  FWD: 4

assist: 3

clean_sheet:             # requires 60+ minutes played
  GK: 4
  DEF: 4
  MID: 1
  FWD: 0

saves_per_point: 3       # 1 pt per 3 saves (divisor not in API; from official explainer)
penalty_save: 5
penalty_miss: -2

goals_conceded:
  points: -1
  per_goals: 2           # -1 per 2 conceded while on the pitch, rounded down
  applies_to: [GK, DEF]  # API: MID/FWD = 0

yellow_card: -1
red_card: -3
own_goal: -2

# Defensive contributions — retained unchanged for 2026/27
defensive_contribution:
  enabled: true
  points: 2              # API: DEF/MID/FWD = 2, GKP = 0
  capped_per_match: 2    # hitting the threshold twice over still scores only 2
  thresholds:
    DEF: 10              # clearances, blocks, interceptions, tackles (CBIT)
    MID: 12              # + ball recoveries (CBIRT)
    FWD: 12              # + ball recoveries (CBIRT)
    GK: null             # goalkeepers do not score defensive contribution points

bonus:
  awarded: [3, 2, 1]     # top three BPS in each match
  # 2026/27 BPS changes — these matter for the bonus model (Item 9):
  #   - clearances/blocks/interceptions now +1 BPS per 3 (was per 2)
  #   - the -1 BPS for being successfully tackled has been REMOVED
  #   - the separate "save from outside the box" metric has been REMOVED
  #   - penalty save reduced from +8 BPS to +7 BPS
  #   - goalkeepers gain +1 BPS for saving a 'big chance'
  # Net intent: less overlap with defensive contributions; more bonus for GKs,
  # attacking full-backs and creative players.
  provisional_bonus_live_from_minute: 20

squad:
  budget: 100.0          # API: squad_total_spend 1000 @ ui_currency_multiplier 10
  size: 15
  positions: {GK: 2, DEF: 5, MID: 5, FWD: 3}
  max_per_club: 3
  starting_xi: 11
  formation:             # API element_types squad_min_play / squad_max_play
    GK: {min: 1, max: 1}
    DEF: {min: 3, max: 5}
    MID: {min: 2, max: 5}
    FWD: {min: 1, max: 3}

transfers:
  free_per_gw: 1
  max_banked: 5          # API: max_extra_free_transfers 4, i.e. 1 + 4
  hit_cost: -4
  transfers_cap: 20      # max transfers in a single gameweek
  sell_profit_share: 0.5 # API: transfers_sell_on_fee — 50% of profit, rounded down to 0.1
  sell_at_purchase_price: false
  # No extra December free transfers in 2026/27 (no AFCON this season).

chips:                   # 8 total: two of each, one per half, no carryover
  wildcard:       {count: 2, windows: [[2, 19],  [20, 38]]}
  free_hit:       {count: 2, windows: [[2, 19],  [20, 38]]}
  bench_boost:    {count: 2, windows: [[1, 19],  [20, 38]]}
  triple_captain: {count: 2, windows: [[1, 19],  [20, 38]]}
  # NOTE: wildcard and free hit are NOT available in GW1; bench boost and triple captain are.
  # First-half chips expire at the GW20 deadline (13:30 GMT, Sat 2 January) and do not carry over.

assistant_manager:
  enabled: false         # all mng_* scoring values are 0 in the API — chip removed for 2026/27

timing:
  timezone: "UTC"
  price_changes_at: "00:00 UK daily"
  gw_lockdown: "09:00 UK on the day after the final match of the gameweek"
  vice_captain_enabled: true
