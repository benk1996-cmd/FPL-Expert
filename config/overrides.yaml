# Hand-entered availability corrections for the LIVE path. Read by
# `fpl_expert.data.overrides`; see that module for what this is and is not.
#
# The model reads no press conferences: it learns a player is unavailable exactly when FPL's
# `status` says so. This file closes the gap between a departure or injury being reported and
# FPL flagging it — nothing more. It is applied at inference, after the snapshot is read, and
# is unreachable from the backtest.
#
#   web_name  exactly as FPL spells it, or `id` when a surname is shared
#   status    FPL's own codes: a available, d doubtful, i injured, s suspended,
#             u unavailable (left the club / not registered), n not in squad
#   until     REQUIRED in spirit — the date this stops applying. An override with no expiry
#             outlives the situation it describes and quietly distorts every later gameweek.
#   reason    what you are asserting, so the next reader can check whether it held
#
# Every entry logs a WARNING when it fires, when it expires, and when it matches nobody.
# Delete entries once FPL catches up; leaving them is harmless only until FPL disagrees.

availability: []
